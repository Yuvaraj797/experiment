<html>
<head>
    <title>Layout Example</title>
    <style>
        #container {
            width: 1000px;
            margin: 0 auto;
        }
        #topbar {
            width: 1000px;
            height: 80px;
            background-color: brown;
            position: relative;
        }
        #banner {
            float: left;
            width: 1000px;
            height: 300px;
            background-color: blue;
            position: relative;
        }
        #menubar {
            float: left;
            width: 1000px;
            height: 80px;
            background-color: green;
            position: relative;
            /* z-index: 9999; */
        }
        #display {
            float: left;
            width: 1000px;
            height: 300px;
            background-color: yellow;
            position: relative;
        }
        #footer {
            float: left;
            width: 1000px;
            height: 300px;
            background-color: white;
            position: relative;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="topbar"></div>
        <div id="banner"></div>
        <div id="menubar"></div>
        <div id="display"></div>
        <div id="footer"></div>
    </div>
</body>
</html>
